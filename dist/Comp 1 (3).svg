  <style>
    .logo-arrow {
      transform: translate(212.334px, 269.044px);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
      will-change: transform, opacity;
    }
    .logo-base {
      transform: translate(211.185px, 264.552px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .brand-logo:hover .logo-arrow,
    .brand-logo.is-hovered .logo-arrow,
    .navbar-animated-logo:hover .logo-arrow {
      transform: translate(253.223px, 245.489px);
      opacity: 1;
    }
    .brand-logo:hover .logo-base,
    .brand-logo.is-hovered .logo-base,
    .navbar-animated-logo:hover .logo-base {
      transform: translate(169.436px, 287.91px);
    }
  </style>

